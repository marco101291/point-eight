spring:
  application:
    name: el-sistema
  datasource:
    url: ${SYSTEM_DB_URL:jdbc:postgresql://localhost:5433/pointeight_system}
    username: ${SYSTEM_DB_USER:pointeight}
    password: ${SYSTEM_DB_PASSWORD:pointeight}
  jpa:
    hibernate:
      # Flyway (db/migration) owns the schema now, DEC-019 — validate just checks the entities
      # agree with it, it never creates or alters anything.
      ddl-auto: ${SYSTEM_DB_DDL:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pointeight}
    password: ${RABBITMQ_PASSWORD:pointeight}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

pointeight:
  cors:
    # Comma-separated origin patterns Spring Security's CORS filter accepts (see SecurityConfig).
    # Only mobile-client's web target needs this; Expo's dev port isn't fixed, hence a pattern.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  auth:
    # Dev-only default — override with a real secret (>= 32 bytes, HS256 needs 256 bits) outside
    # local development. Self-issued and self-validated (DEC-022): no external identity provider.
    jwt-secret: ${JWT_SECRET:dev-only-jwt-secret-change-in-production-0123456789ABCDEF}
    # DEC-023: short-lived access token (nobody can revoke it early) backed by a revocable,
    # long-lived refresh token — see JwtTokenIssuer / RefreshToken.
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  engine:
    base-url: ${ENGINE_BASE_URL:http://localhost:8000}
  push:
    # Expo's push service, not Firebase/APNs directly — see ExpoPushNotificationSender.
    expo-base-url: ${EXPO_PUSH_BASE_URL:https://exp.host}
  match:
    # Default duration for a match when registration doesn't specify one (12 h).
    default-expiry-seconds: ${MATCH_DEFAULT_EXPIRY_SECONDS:43200}
    # How many registered users AssignNextMatchUseCase looks at when searching for a candidate.
    # No real query yet (see DEC in docs/architecture.md) — just the first page of users.
    candidate-pool-size: ${MATCH_CANDIDATE_POOL_SIZE:50}
    # How often MatchExpiryScheduler sweeps for ACTIVE matches past their expiresAt (ms).
    expiry-check-interval-ms: ${MATCH_EXPIRY_CHECK_INTERVAL_MS:60000}
    # DEC-028: ExpiryDurationPolicy's real-time range for a score-derived match duration.
    # Floor mirrors default-expiry-seconds on purpose — a poorly-predicted pair shouldn't get
    # noticeably less real time than a match with no score yet. Ceiling is 7 days: enough to feel
    # like more than the demo cadence without needing a countdown UI rethink for this alone.
    expiry-floor-seconds: ${MATCH_EXPIRY_FLOOR_SECONDS:43200}
    expiry-ceiling-seconds: ${MATCH_EXPIRY_CEILING_SECONDS:604800}
    # Must match python-engine's own MAX_DAYS (app/domain/simulation.py) — same manual cross-service
    # sync point DEC-013 already accepts for modelVersion, not solved differently here.
    compatibility-simulation-max-days: ${MATCH_COMPATIBILITY_SIMULATION_MAX_DAYS:1000}

logging:
  level:
    com.pointeight: DEBUG
