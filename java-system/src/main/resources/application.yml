spring:
  application:
    name: el-sistema
  datasource:
    url: ${SYSTEM_DB_URL:jdbc:postgresql://localhost:5433/pointeight_system}
    username: ${SYSTEM_DB_USER:pointeight}
    password: ${SYSTEM_DB_PASSWORD:pointeight}
  jpa:
    hibernate:
      # Flyway (db/migration) owns the schema now, DEC-019 — validate just checks the entities
      # agree with it, it never creates or alters anything.
      ddl-auto: ${SYSTEM_DB_DDL:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:pointeight}
    password: ${RABBITMQ_PASSWORD:pointeight}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

pointeight:
  engine:
    base-url: ${ENGINE_BASE_URL:http://localhost:8000}
  match:
    # Default duration for a match when registration doesn't specify one (12 h).
    default-expiry-seconds: ${MATCH_DEFAULT_EXPIRY_SECONDS:43200}
    # How many registered users AssignNextMatchUseCase looks at when searching for a candidate.
    # No real query yet (see DEC in docs/architecture.md) — just the first page of users.
    candidate-pool-size: ${MATCH_CANDIDATE_POOL_SIZE:50}

logging:
  level:
    com.pointeight: DEBUG
